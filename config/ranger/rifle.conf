# Rifle rules used by rnvimr.
#
# PDFs are opened in zathura in a detached process.
ext pdf, has zathura, X, flag f = zathura -- "$@"

# Everything else goes through $EDITOR. rnvimr patches rifle so any action
# containing $EDITOR is handled by rpc_edit and opens the file in Neovim.
label editor = ${VISUAL:-$EDITOR} -- "$@"
